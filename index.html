<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#6f1830">
  <title>Freen 電視劇多重宇宙捕捉挑戰</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">F</div>
      <div>
        <h1>Freen 多重宇宙</h1>
        <p>電視劇角色捕捉挑戰</p>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="切換音效">🔊</button>
    </header>

    <section id="mapScreen" class="screen active" aria-labelledby="mapTitle">
      <div class="intro-card">
        <span class="eyebrow">MULTIVERSE MISSION</span>
        <h2 id="mapTitle">找出每個宇宙的 Freen！</h2>
        <p>完成 10 個宇宙的捕捉任務。臘腸狗可以加分；友情客串、仙人掌與後期炸彈可別誤觸！</p>
        <div class="progress-row">
          <span>目前星星</span>
          <strong><span id="totalStars">0</span> / 30 ⭐</strong>
        </div>
      </div>

      <div id="levelList" class="level-list" aria-label="關卡選擇"></div>
      <button id="resetBtn" class="text-btn">重新開始全部進度</button>
    </section>

    <section id="gameScreen" class="screen" aria-label="遊戲畫面">
      <div class="mission-head">
        <button id="backBtn" class="back-btn" aria-label="返回關卡地圖">‹</button>
        <div>
          <span id="levelTag" class="level-tag">LEVEL 1</span>
          <h2 id="missionTitle">初次相遇</h2>
        </div>
        <button id="pauseBtn" class="icon-btn" aria-label="暫停遊戲">Ⅱ</button>
      </div>

      <div class="stats-grid">
        <div class="stat"><span>時間</span><strong id="timeValue">20.0</strong></div>
        <div class="stat"><span>分數</span><strong id="scoreValue">0</strong></div>
        <div class="stat combo-stat"><span>連擊</span><strong id="comboValue">×0</strong></div>
      </div>

      <div id="targetPanel" class="target-panel hidden">
        <span>本次目標</span>
        <img id="targetImg" src="tv-role-1.png" alt="目標角色">
        <strong id="targetName">角色一</strong>
        <small id="targetTimer">5 秒後切換</small>
      </div>

      <div class="mission-strip">
        <span id="missionHint">捕捉角色，達成目標分數！</span>
        <strong id="goalValue">目標 12</strong>
      </div>

      <div id="arena" class="arena" aria-label="角色捕捉區">
        <div class="freen-time" id="freenTimeBanner">✨ FREEN TIME ✨<small>慢動作・雙倍分數</small></div>
        <div class="boom-effect" id="boomEffect" aria-hidden="true">
          <span class="boom-core">BOOM!</span>
          <span class="boom-ring ring-one"></span>
          <span class="boom-ring ring-two"></span>
          <span class="boom-spark">💥</span>
        </div>
        <div class="portal-grid" id="portalGrid"></div>
        <div class="toast-layer" id="toastLayer" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="pauseOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="遊戲暫停">
    <div class="modal pause-modal">
      <span class="modal-icon">⏸</span>
      <h2>宇宙暫停中</h2>
      <p>準備好了就繼續捕捉！</p>
      <button id="resumeBtn" class="primary-btn">繼續遊戲</button>
      <button id="pauseMapBtn" class="secondary-btn">回關卡地圖</button>
    </div>
  </div>

  <div id="resultOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <div class="modal result-modal">
      <span id="resultBadge" class="result-badge">MISSION CLEAR</span>
      <h2 id="resultTitle">關卡完成！</h2>
      <div id="resultStars" class="result-stars">☆☆☆</div>
      <div class="result-score"><span>本次分數</span><strong id="resultScore">0</strong></div>
      <p id="resultMessage">新的宇宙已經解鎖。</p>
      <button id="nextBtn" class="primary-btn">下一關</button>
      <div class="button-row">
        <button id="retryBtn" class="secondary-btn">再玩一次</button>
        <button id="mapBtn" class="secondary-btn">關卡地圖</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
